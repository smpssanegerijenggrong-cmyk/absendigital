name: Install SANJARA HADIR source

on:
  push:
    branches: [main]
    paths:
      - "_deploy/**"
      - ".github/workflows/install-sanjara.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          cat \
            _deploy/part-00 \
            _deploy/part-01 \
            _deploy/part-02 \
            _deploy/part-03 \
            _deploy/part-04 \
            _deploy/part-05 \
            _deploy/fix06-0 \
            _deploy/fix06-1 \
            _deploy/part-07 \
            _deploy/part-08 \
            _deploy/fix09-0 \
            _deploy/fix09-1 \
            _deploy/p10-0 \
            _deploy/p10-1 \
            _deploy/p11-0 \
            _deploy/p11-1 \
            _deploy/p12-0 \
            _deploy/p12x-0 \
            _deploy/p12x-1 \
            _deploy/p13-fix \
            > /tmp/sanjara.b64
          base64 -d /tmp/sanjara.b64 > /tmp/sanjara.zip
          echo "885789cb57c63f1e78452e17c0323f606f75d9ce6db65578622e2c6b249b5ce2  /tmp/sanjara.zip" | sha256sum -c -
          unzip -t /tmp/sanjara.zip
          rm -rf /tmp/unpack
          mkdir -p /tmp/unpack
          unzip -q /tmp/sanjara.zip -d /tmp/unpack
          src=/tmp/unpack/SANJARA_HADIR_VERCEL_FIX
          test -f "$src/app/main.py"
          test -f "$src/pyproject.toml"
          test -f "$src/vercel.json"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. .
          grep -qxF 'itsdangerous>=2.2,<3' requirements.txt || echo 'itsdangerous>=2.2,<3' >> requirements.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pytest -q

      - name: Commit application source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: install SANJARA HADIR School Edition v2.0.1"
          git push origin main
