[project]
name = "sanjara-hadir"
version = "2.0.1"
description = "SANJARA HADIR — School Edition"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "python-dotenv>=1.0,<2",
  "openpyxl>=3.1,<4",
  "qrcode[pil]>=8,<9",
  "cryptography>=43,<47",
  "requests>=2.32,<3",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
]

[tool.vercel]
entrypoint = "app.main:app"
